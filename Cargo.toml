[package]
name = "xmip-core-message-csv"
version.workspace = true
edition.workspace = true
license.workspace = true
repository = "https://github.com/IlleNilsson/xmip-core-message-csv"
description = "CSV shape: RFC 4180 records as numbered parts with the header row named when there is one, no announced type. A xmip-core-message technology."
publish.workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
# The parent capability's `Shape` (`message::shape`; repository-model.md),
# and the Stream it shapes.
message = { workspace = true }
stream = { workspace = true }
# A media type's parameters, and the multipart body, as MIME reads them.
codec = { workspace = true }

[dev-dependencies]
xcore = { workspace = true }

[lints]
workspace = true
